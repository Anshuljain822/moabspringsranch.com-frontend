# ═══════════════════════════════════════════════════════════
# Moab Springs Ranch — Nginx configuration
# Handles: clean URLs (no .html), gzip/brotli, caching,
#          security headers, HTTP→HTTPS redirect
# ═══════════════════════════════════════════════════════════

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name moabspringsranch.com www.moabspringsranch.com
                staging.moabspringsranch.com;
    return 301 https://$host$request_uri;
}

# ── Production ────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name moabspringsranch.com www.moabspringsranch.com;
    root /var/www/moabspringsranch.com;

    ssl_certificate     /etc/letsencrypt/live/moabspringsranch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moabspringsranch.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    server_tokens off;
    index index.html;

    # ── Security headers ──────────────────────────────────
    add_header X-Frame-Options              "SAMEORIGIN"                            always;
    add_header X-Content-Type-Options       "nosniff"                               always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin"       always;
    add_header Permissions-Policy           "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security    "max-age=31536000; includeSubDomains; preload" always;

    # ── Clean URLs — serve /about instead of /the-ranch.html ──
    #
    # How it works:
    #   1. Try the URI as-is (catches exact files like /images/foo.webp)
    #   2. Try URI as a directory with index.html
    #   3. Try URI + .html (maps /about → /the-ranch.html)
    #   4. 404 if nothing found
    #
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Serve pre-compressed brotli if browser supports it
    location ~* \.(js|css|woff2?|ttf|otf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;

        # Serve .br (brotli) if available and browser accepts it
        brotli_static on;
        # Serve .gz (gzip) as fallback
        gzip_static on;
    }

    # Never cache HTML
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache images 1 year
    location ~* \.(webp|jpg|jpeg|png|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Block hidden files and sensitive paths
    location ~ /\. {
        deny all;
        return 404;
    }
    location ~ \.(git|env|json|md|sh|yml|yaml|config)$ {
        deny all;
        return 404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript
               application/javascript image/svg+xml;
}

# ── Staging (password protected) ─────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.moabspringsranch.com;
    root /var/www/staging.moabspringsranch.com;

    ssl_certificate     /etc/letsencrypt/live/moabspringsranch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moabspringsranch.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    server_tokens off;
    index index.html;

    auth_basic "Staging — Authorised Only";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(js|css|woff2?|ttf|otf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        brotli_static on;
        gzip_static on;
    }

    location ~ /\. { deny all; return 404; }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript
               application/javascript image/svg+xml;
}
